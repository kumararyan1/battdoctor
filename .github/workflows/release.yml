name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - run: ./scripts/build_menubar_app.sh
      - run: cp scripts/install_helper.sh dist/install_helper.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/Battdoctor.app.zip
            dist/install_helper.sh
          generate_release_notes: true
